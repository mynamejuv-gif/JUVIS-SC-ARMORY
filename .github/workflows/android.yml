name: Android debug build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.401'
      - name: Test and build the lightweight APK
        run: |
          ./Build-Android.ps1 -InstallDependencies `
            -AndroidSdkDirectory (Join-Path $env:RUNNER_TEMP 'juvis-android-sdk') `
            -JavaSdkDirectory (Join-Path $env:RUNNER_TEMP 'juvis-jdk')
      - name: Upload installable test APK
        uses: actions/upload-artifact@v7
        with:
          name: JUVIS-Android-debug-${{ github.run_number }}
          path: artifacts/*-Signed.apk
          if-no-files-found: error
          retention-days: 14
